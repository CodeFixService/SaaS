<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Mi pedido</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/app.css">
<style>
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  td.r { text-align: right; white-space: nowrap; padding-left: 10px; }
  .prev img { max-height: 260px; width: auto; display: block; margin: 10px auto 0; border-radius: 12px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <p class="empty" id="cargando">Cargando…</p>
  <div class="hidden" id="todo">
    <div class="card"><div class="hero"><div class="logo" id="logo"></div>
      <div class="grow"><h1 id="nombre"></h1><div class="sub" id="cod"></div></div></div>
      <p style="margin:12px 0 0"><span class="pill" id="estado"></span></p>
      <p class="sub" id="estadoTxt" style="margin:8px 0 0"></p>
    </div>
    <div class="card hidden" id="pagar">
      <h2>💳 Paga y sube tu comprobante</h2>
      <p style="margin-top:0">Monto a pagar: <b id="monto"></b></p>
      <p class="sub" id="linkTxt"></p>
      <a class="btn block" id="link" target="_blank" rel="noopener">Ir a pagar</a>
      <p class="sub" id="expira" style="margin:10px 0"></p>
      <label for="foto" class="btn alt block" style="text-align:center">📷 Subir foto del comprobante</label>
      <input type="file" id="foto" accept="image/*" class="hidden">
      <div class="prev" id="prev"></div>
      <button id="bEnviar" class="block hidden" style="margin-top:10px">Enviar comprobante</button>
      <p class="err" id="pErr"></p>
      <button id="bCancelar" class="ghost small" style="margin-top:10px">Cancelar pedido</button>
    </div>
    <div class="card"><h2>🧾 Detalle</h2><table id="detalle"></table><p class="sub" id="entrega" style="margin:10px 0 0"></p></div>
    <div class="card"><div class="btns" id="acciones" style="margin:0"></div></div>
  </div>
</main>
<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/app.js"></script>
<script>
(async function () {
  'use strict';
  const { $, esc, plata } = App;
  App.registrarSW();
  const k = new URLSearchParams(location.search).get('k') || '';
  const ESTADOS = {
    por_pagar: ['⏳ Esperando pago', 'warn', 'Paga con el link y sube la foto del comprobante para confirmar.'],
    en_revision: ['🧾 Comprobante en revisión', 'info', 'La tienda está revisando tu pago. Te avisará por WhatsApp.'],
    confirmado: ['✅ Confirmado', 'ok', 'Tu pago fue aprobado. La tienda está por preparar tu pedido.'],
    preparando: ['📦 Preparando', 'info', 'La tienda está preparando tu pedido.'],
    listo: ['✅ Listo', 'ok', 'Tu pedido está listo.'], entregado: ['🎉 Entregado', 'ok', '¡Gracias por tu compra!'],
    rechazado: ['❌ Pago rechazado', 'bad', 'La tienda no pudo validar tu pago. Escríbele por WhatsApp.'],
    cancelado: ['❌ Cancelado', 'bad', 'Este pedido fue cancelado.'], expirado: ['⌛ Expirado', '', 'Se acabó el tiempo para pagar y los productos se liberaron.']
  };
  let p, imagen = null;
  async function cargar() {
    try { p = await App.rpc('pedido_ver', { p_token: k }); } catch (e) { $('cargando').textContent = '⚠️ ' + e.message; return; }
    if (!p) { $('cargando').textContent = 'Pedido no encontrado. Revisa tu enlace.'; return; }
    const t = p.negocio, e = ESTADOS[p.estado] || [p.estado, '', ''];
    document.title = 'Pedido #' + p.codigo + ' · ' + t.nombre;
    App.tema(t.color); App.pintarLogo($('logo'), t);
    $('nombre').textContent = t.nombre;
    $('cod').textContent = 'Pedido #' + p.codigo + ' · ' + App.fHora(p.created_at);
    $('estado').textContent = e[0]; $('estado').className = 'pill ' + e[1];
    $('estadoTxt').textContent = e[2] + (p.nota_negocio ? ' Nota de la tienda: ' + p.nota_negocio : '');
    $('detalle').innerHTML = p.items.map((i) => '<tr><td>' + i.cant + ' × ' + esc(i.nombre) + '</td><td class="r">' + plata(i.precio * i.cant) + '</td></tr>').join('') +
      (p.despacho ? '<tr><td>Despacho</td><td class="r">' + plata(p.despacho) + '</td></tr>' : '') +
      '<tr><td><b>Total</b></td><td class="r"><b>' + plata(p.total) + '</b></td></tr>' +
      (p.a_pagar < p.total ? '<tr><td>Abono online</td><td class="r">' + plata(p.a_pagar) + '</td></tr><tr><td>Pagas al recibir</td><td class="r">' + plata(p.total - p.a_pagar) + '</td></tr>' : '');
    $('entrega').textContent = p.entrega === 'despacho' ? '🚚 Despacho a: ' + p.direccion : '🏪 Retiro en: ' + ([t.direccion, t.comuna].filter(Boolean).join(', ') || 'la tienda');
    const pend = p.estado === 'por_pagar';
    $('pagar').classList.toggle('hidden', !pend);
    if (pend) {
      $('monto').textContent = plata(p.a_pagar);
      $('linkTxt').textContent = p.link_texto || 'Si el link te pide el monto, escribe exactamente ' + plata(p.a_pagar) + '.';
      $('link').href = p.link || '#';
      $('expira').textContent = '⏱️ Tienes hasta las ' + new Date(p.expira_at).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) + ' para subir el comprobante.';
    }
    $('acciones').innerHTML = (t.telefono ? '<a class="btn alt" target="_blank" rel="noopener" href="' + App.wa(t.telefono, 'Hola, consulto por mi pedido #' + p.codigo) + '">📲 WhatsApp de la tienda</a>' : '') +
      '<a class="btn ghost" href="../c/?s=' + encodeURIComponent(t.slug) + '">🛍️ Volver a la tienda</a>';
    $('cargando').classList.add('hidden'); $('todo').classList.remove('hidden');
  }
  $('foto').onchange = async () => {
    const f = $('foto').files[0]; if (!f) return;
    $('pErr').textContent = '';
    try { imagen = await App.comprimirComprobante(f); $('prev').innerHTML = '<img alt="Comprobante" src="' + imagen + '">'; $('bEnviar').classList.remove('hidden'); }
    catch (e) { $('pErr').textContent = e.message; }
  };
  $('bEnviar').onclick = async () => {
    const b = $('bEnviar'); b.disabled = true;
    try { const r = await App.rpc('pedido_comprobante', { p_token: k, p_imagen: imagen }); if (!r.ok) throw new Error(r.error); App.toast('✅ Comprobante enviado'); await cargar(); }
    catch (e) { $('pErr').textContent = e.message; }
    b.disabled = false;
  };
  $('bCancelar').onclick = async () => {
    if (!await App.confirmar('¿Cancelar este pedido? Los productos se liberan.', 'Sí, cancelar')) return;
    try { const r = await App.rpc('pedido_cancelar', { p_token: k }); if (!r.ok) throw new Error(r.error); await cargar(); } catch (e) { App.toast(e.message); }
  };
  await cargar();
  setInterval(() => { if (!document.hidden && p && !['entregado', 'cancelado', 'expirado', 'rechazado'].includes(p.estado)) cargar(); }, 30000);
})();
</script>
</body>
</html>
