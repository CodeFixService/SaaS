<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>Centro de Mando</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="cm.css">
<link rel="stylesheet" href="../shared/tema.css">
</head>
<body class="con-tabs">
<header class="top"><h1 style="flex:1;margin:0"><span id="chipModo"></span></h1><button class="icon-btn" id="bBuscar" aria-label="Buscar"></button><button class="icon-btn" id="bCampana" aria-label="Avisos" style="position:relative"></button></header>
<main>
  <section class="view on" id="v-hoy"></section><section class="view" id="v-tablero"></section><section class="view" id="v-metas"></section>
  <section class="view" id="v-cerebro"></section><section class="view" id="v-pedidos"></section><section class="view" id="v-panel"></section><section class="view" id="v-mas"></section>
</main>
<nav class="tabs" id="nav"></nav>
<div id="toast" role="status"></div>
<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/app.js"></script>
<script src="cm.js"></script>
<script src="estilo.js"></script>
<script>
(async function () {
  App.registrarSW();
  const c = await App.requerir();
  CM.cuenta = c;
  await App.cargarPublica();
  try { await CM.cargar(); } catch (e) { App.toast(e.message); }
  const nav = document.getElementById('nav');
  nav.innerHTML = CM.TABS.map((t) => t[0] === 'nuevo' ? '<button type="button" class="nuevo" data-v="nuevo" aria-label="Anotar"><span class="i">' + CM.ico('plus', 28) + '</span>Anotar</button>'
    : '<button type="button" data-v="' + t[0] + '"><span class="i">' + CM.ico(t[0], 22) + '</span>' + t[1] + '</button>').join('');
  nav.onclick = (e) => { const b = e.target.closest('button[data-v]'); if (b) CM.ir(b.dataset.v); };
  const bBus = document.getElementById('bBuscar'); bBus.innerHTML = CM.ico('lupa', 20); bBus.onclick = CM.buscar;
  App.campana(document.getElementById('bCampana'));
  // Núcleo (pagos.js): cuenta nueva que debe su primer pago → pantalla de activación.
  if (c.rol === 'usuario') { if (!window.CFX_PAGOS) await new Promise((r) => addEventListener('load', r)); CFX_PAGOS.revisar({ rpc: App.rpc, salir: App.salir }); }
  CM.aplicarTema(); CM.primerTour(); CM.limpiarAnimo(); CM.chip(); setInterval(CM.chip, 60000);
  CM.iniciarLatido();
  CM.ir(location.hash.slice(1) || 'hoy');
  setInterval(() => { if (!document.hidden && Date.now() - CM.sync > 300000) CM.cargar().then(CM.emit).catch(() => {}); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - CM.sync > 120000) CM.cargar().then(CM.emit).catch(() => {}); });
})();
</script>
<script src="../shared/iconos.js"></script>
<script src="../shared/instalar.js"></script>
<script src="../shared/barra.js"></script>
<script src="../shared/auto.js"></script>
<script src="../shared/fotos.js"></script>
<script src="../shared/voz.js"></script>
<script src="../shared/respaldo.js"></script>
<script src="../shared/pagos.js"></script>
<script src="../shared/verificar.js"></script>
</body>
</html>
