<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Tienda</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/app.css">
<style>
  .prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .prod { padding: 10px; display: flex; flex-direction: column; gap: 6px; margin: 0; }
  .prod .foto { aspect-ratio: 1; border-radius: 10px; background: var(--line) center/cover no-repeat; display: grid; place-items: center; font-size: 34px; }
  .prod b { font-size: 15px; }
  .prod .precio { font-weight: 800; color: var(--brand); }
  .cant { display: flex; align-items: center; gap: 8px; }
  .cant button { padding: 4px 12px; }
  .barra { position: sticky; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  .info-linea { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  td.r { text-align: right; white-space: nowrap; padding-left: 10px; }
</style>
</head>
<body>
<main>
  <p class="empty" id="cargando">Cargando…</p>
  <div class="hidden" id="todo">
    <div class="card">
      <div class="hero"><div class="logo" id="logo"></div>
        <div class="grow"><h1 id="nombre"></h1><div id="nota"></div><div class="sub" id="dir"></div></div></div>
      <p id="desc" class="hidden" style="margin:12px 0 0"></p>
      <div class="info-linea" id="contacto"></div>
    </div>
    <div class="card hidden" id="cerrado"><p style="margin:0">Esta tienda no está recibiendo pedidos online ahora. Escríbele por WhatsApp.</p></div>
    <input id="buscar" placeholder="Buscar producto…" aria-label="Buscar producto" style="margin-bottom:10px">
    <div class="seg" id="cats"></div>
    <div class="prods" id="prods"></div>

    <div class="card hidden" id="checkout">
      <h2>🛒 Tu pedido</h2>
      <table id="resumen"></table>
      <h2 style="margin-top:16px">Tus datos</h2>
      <div class="row"><div><label for="fNom">Nombre</label><input id="fNom" maxlength="80" autocomplete="name"></div>
        <div><label for="fTel">WhatsApp</label><input id="fTel" inputmode="tel" maxlength="30" autocomplete="tel" placeholder="+56 9 1234 5678"></div></div>
      <div class="row"><div><label for="fRut">RUT</label><input id="fRut" maxlength="12" placeholder="12.345.678-5"></div>
        <div><label for="fEmail">Correo (opcional)</label><input id="fEmail" type="email" maxlength="120" autocomplete="email"></div></div>
      <div id="entregaBox">
        <label for="fEntrega">Entrega</label>
        <select id="fEntrega"><option value="retiro">Retiro en tienda</option><option value="despacho">Despacho a domicilio</option></select>
      </div>
      <div id="dirBox" class="hidden"><label for="fDir">Dirección de despacho</label><input id="fDir" maxlength="200" autocomplete="street-address"></div>
      <label for="fNota">Nota (opcional)</label><textarea id="fNota" maxlength="500"></textarea>
      <div class="aviso" id="pagoInfo" style="margin-top:10px"></div>
      <button id="bPedir" type="button" class="block">Hacer pedido</button>
      <p class="err" id="fErr"></p>
    </div>
  </div>
</main>
<div class="barra hidden" id="barra"><div class="grow"><b id="bCant"></b><div class="sub" id="bTotal"></div></div><button id="bVer">Ver pedido</button></div>
<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/app.js"></script>
<script>
(async function () {
  'use strict';
  const { $, esc, plata } = App;
  App.registrarSW();
  const slug = new URLSearchParams(location.search).get('s') || '';
  if (!slug) { $('cargando').textContent = 'Enlace no válido. Pídele a la tienda su enlace.'; return; }
  let t;
  try { t = await App.rpc('catalogo_publico', { p_slug: slug }); } catch (e) { $('cargando').textContent = '⚠️ ' + e.message; return; }
  document.title = t.nombre;
  App.tema(t.color);
  App.pintarLogo($('logo'), t);
  $('nombre').textContent = t.nombre;
  $('nota').innerHTML = App.nota(t.nota);
  $('dir').textContent = [t.direccion, t.comuna].filter(Boolean).join(', ');
  if (t.descripcion) { $('desc').textContent = t.descripcion; $('desc').classList.remove('hidden'); }
  $('contacto').innerHTML = (t.telefono ? '<a class="btn small alt" target="_blank" rel="noopener" href="' + App.wa(t.telefono, 'Hola 👋') + '">📲 WhatsApp</a>' : '') +
    (t.instagram ? '<a class="btn small ghost" target="_blank" rel="noopener" href="https://instagram.com/' + encodeURIComponent(t.instagram.replace('@', '')) + '">📷 Instagram</a>' : '');
  $('cerrado').classList.toggle('hidden', t.abierta);
  if (!t.despacho) $('entregaBox').classList.add('hidden');
  $('cargando').classList.add('hidden'); $('todo').classList.remove('hidden');

  // Carro guardado por tienda en este navegador.
  const KEY = 'carro-' + t.id;
  let carro = {};
  try { carro = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { carro = {}; }
  const P = {}; t.productos.forEach((p) => { P[p.id] = p; });
  Object.keys(carro).forEach((id) => { if (!P[id] || P[id].agotado) delete carro[id]; });
  const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(carro)); } catch (e) { /* sin almacenamiento */ } };
  let cat = '';

  const cats = [...new Set(t.productos.map((p) => p.categoria).filter(Boolean))];
  $('cats').innerHTML = cats.length ? '<button data-c="" class="on">Todo</button>' + cats.map((c) => '<button data-c="' + esc(c) + '">' + esc(c) + '</button>').join('') : '';
  $('cats').onclick = (e) => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; $('cats').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); pintar(); };
  $('buscar').oninput = pintar;

  function totales() {
    let sub = 0, n = 0;
    Object.keys(carro).forEach((id) => { sub += P[id].precio * carro[id]; n += carro[id]; });
    const desp = t.despacho && $('fEntrega').value === 'despacho' ? t.despacho_costo : 0;
    const tot = sub + desp;
    const pagar = t.cobro_modo === 'abono' ? Math.max(1, Math.ceil(tot * t.cobro_pct / 100)) : tot;
    return { sub, n, desp, tot, pagar };
  }
  function pintar() {
    const f = $('buscar').value.trim().toLowerCase();
    const l = t.productos.filter((p) => (!cat || p.categoria === cat) && (!f || (p.nombre + ' ' + p.descripcion).toLowerCase().includes(f)));
    $('prods').innerHTML = l.length ? l.map((p) => {
      const c = carro[p.id] || 0;
      const foto = p.foto ? ' style="background-image:url(\'' + p.foto + '\')"' : '';
      return '<div class="card prod"><div class="foto"' + foto + '>' + (p.foto ? '' : esc(t.icono)) + '</div><b>' + esc(p.nombre) + '</b>' +
        (p.descripcion ? '<div class="sub">' + esc(p.descripcion) + '</div>' : '') + '<div class="precio">' + plata(p.precio) + '</div>' +
        (p.agotado ? '<span class="pill bad">Agotado</span>' : !t.abierta ? '' : c ? '<div class="cant"><button class="ghost" data-m="' + p.id + '">−</button><b>' + c + '</b><button data-p="' + p.id + '">+</button></div>'
          : '<button class="small" data-p="' + p.id + '">Agregar</button>') + '</div>';
    }).join('') : '<p class="empty">No hay productos aquí.</p>';
    const x = totales();
    $('barra').classList.toggle('hidden', !x.n);
    $('bCant').textContent = x.n + (x.n === 1 ? ' producto' : ' productos');
    $('bTotal').textContent = plata(x.sub);
    pintarResumen();
  }
  $('prods').onclick = (e) => {
    const m = e.target.closest('[data-m]'), p = e.target.closest('[data-p]');
    if (p) {
      const pr = P[p.dataset.p], c = (carro[pr.id] || 0) + 1;
      if (pr.stock !== null && c > pr.stock) { App.toast('Solo quedan ' + pr.stock); return; }
      if (c > 99) return;
      carro[pr.id] = c;
    } else if (m) { carro[m.dataset.m]--; if (carro[m.dataset.m] <= 0) delete carro[m.dataset.m]; } else return;
    guardar(); pintar();
  };
  function pintarResumen() {
    const x = totales();
    $('checkout').classList.toggle('hidden', !x.n || !t.abierta);
    $('resumen').innerHTML = Object.keys(carro).map((id) => '<tr><td>' + carro[id] + ' × ' + esc(P[id].nombre) + '</td><td class="r">' + plata(P[id].precio * carro[id]) + '</td></tr>').join('') +
      (x.desp ? '<tr><td>Despacho</td><td class="r">' + plata(x.desp) + '</td></tr>' : '') +
      '<tr><td><b>Total</b></td><td class="r"><b>' + plata(x.tot) + '</b></td></tr>';
    $('pagoInfo').innerHTML = '<b>💳 ' + (t.cobro_modo === 'abono' ? 'Abono para confirmar (' + t.cobro_pct + '%): ' : 'A pagar: ') + plata(x.pagar) + '</b>' +
      (t.cobro_modo === 'abono' ? ' <span class="sub">· el resto lo pagas al recibir</span>' : '') +
      '<div class="sub">Después de pedir, pagas con el link de la tienda y subes la foto del comprobante. Tienes ' + t.minutos_pago + ' minutos; mientras, tus productos quedan apartados.</div>';
  }
  $('fEntrega').onchange = () => { $('dirBox').classList.toggle('hidden', $('fEntrega').value !== 'despacho'); pintarResumen(); };
  $('bVer').onclick = () => $('checkout').scrollIntoView({ behavior: 'smooth' });

  // RUT: valida el dígito verificador también aquí, para avisar antes de enviar.
  function rutValido(r) {
    r = String(r || '').replace(/[^0-9kK]/g, '').toUpperCase();
    if (r.length < 2 || r.length > 9) return false;
    const cuerpo = r.slice(0, -1), dv = r.slice(-1);
    let s = 0, m = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) { s += +cuerpo[i] * m; m = m === 7 ? 2 : m + 1; }
    const res = 11 - (s % 11);
    return dv === (res === 11 ? '0' : res === 10 ? 'K' : String(res));
  }
  $('fRut').onblur = () => {
    const r = $('fRut').value.replace(/[^0-9kK]/g, '').toUpperCase();
    if (r.length > 1) $('fRut').value = r.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + r.slice(-1);
  };

  $('bPedir').onclick = async () => {
    $('fErr').textContent = '';
    if (!rutValido($('fRut').value)) { $('fErr').textContent = 'RUT no válido: revisa el dígito verificador'; return; }
    const b = $('bPedir'); b.disabled = true; b.textContent = 'Enviando…';
    try {
      const r = await App.rpc('pedido_crear', {
        p_negocio: t.id, p_items: Object.keys(carro).map((id) => ({ id, cant: carro[id] })), p_nombre: $('fNom').value, p_telefono: $('fTel').value,
        p_rut: $('fRut').value, p_email: $('fEmail').value, p_entrega: t.despacho ? $('fEntrega').value : 'retiro', p_direccion: $('fDir').value, p_nota: $('fNota').value });
      if (!r.ok) throw new Error(r.error);
      carro = {}; guardar();
      location.href = '../p/?k=' + encodeURIComponent(r.token);
    } catch (e) { $('fErr').textContent = e.message; b.disabled = false; b.textContent = 'Hacer pedido'; }
  };
  pintar();
})();
</script>
</body>
</html>
